services:
  # Browser-oriented control plane. Containers cannot automate the host desktop.
  djenis-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ${DJENIS_AGENT_IMAGE:-djenis-ai-agent:latest}
    container_name: djenis-agent
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 30s
    environment:
      DJENIS_WEB_AUTH_TOKEN: ${DJENIS_WEB_AUTH_TOKEN:?Set DJENIS_WEB_AUTH_TOKEN in .env}
      DJENIS_RUNTIME_MODE: docker
      DJENIS_PERMISSION_TIER: ${DJENIS_PERMISSION_TIER:-observe}

      # Local inference only. The endpoint is on the internal control network.
      DJENIS_LOCAL_LLM_BACKEND: ollama
      DJENIS_LOCAL_LLM_ENDPOINT: http://ollama:11434
      DJENIS_LOCAL_LLM_MODEL: ${DJENIS_LOCAL_LLM_MODEL:-qwen3-vl:8b}
      DJENIS_LOCAL_LLM_EXPECTED_DIGEST: ${DJENIS_LOCAL_LLM_EXPECTED_DIGEST:-}
      DJENIS_LOCAL_LLM_CONTEXT_TOKENS: ${DJENIS_LOCAL_LLM_CONTEXT_TOKENS:-65536}
      DJENIS_LOCAL_LLM_VISION: ${DJENIS_LOCAL_LLM_VISION:-true}
      DJENIS_LOCAL_LLM_KEEP_ALIVE: ${DJENIS_LOCAL_LLM_KEEP_ALIVE:-10m}
      DJENIS_LOCAL_LLM_SEED: ${DJENIS_LOCAL_LLM_SEED:-0}
      DJENIS_LOCAL_LLM_RESPONSE_MAX_BYTES: ${DJENIS_LOCAL_LLM_RESPONSE_MAX_BYTES:-1048576}
      DJENIS_LOCAL_LLM_IMAGE_MAX_BYTES: ${DJENIS_LOCAL_LLM_IMAGE_MAX_BYTES:-5242880}
      DJENIS_LOCAL_LLM_VISION_MAX_DIMENSION: ${DJENIS_LOCAL_LLM_VISION_MAX_DIMENSION:-1600}
      DJENIS_LOCAL_LLM_VISION_QUALITY: ${DJENIS_LOCAL_LLM_VISION_QUALITY:-80}

      DJENIS_MAX_LOOP_TURNS: ${DJENIS_MAX_LOOP_TURNS:-50}
      DJENIS_ACTION_TIMEOUT: ${DJENIS_ACTION_TIMEOUT:-45}
      DJENIS_API_TIMEOUT: ${DJENIS_API_TIMEOUT:-120}
      DJENIS_API_MAX_RETRIES: ${DJENIS_API_MAX_RETRIES:-3}
      DJENIS_API_RETRY_DELAY: ${DJENIS_API_RETRY_DELAY:-2.0}
      DJENIS_TASK_TIMEOUT: ${DJENIS_TASK_TIMEOUT:-900}
      DJENIS_LOG_LEVEL: ${DJENIS_LOG_LEVEL:-INFO}
      DJENIS_VERBOSE_LOGGING: ${DJENIS_VERBOSE_LOGGING:-false}
      DJENIS_STREAM_MAX_FPS: ${DJENIS_STREAM_MAX_FPS:-15}
      DJENIS_STREAM_FRAME_QUALITY: ${DJENIS_STREAM_FRAME_QUALITY:-80}
      DJENIS_WEB_MAX_CONNECTIONS: ${DJENIS_WEB_MAX_CONNECTIONS:-8}
      DJENIS_WEB_STREAM_MAX_CLIENTS: ${DJENIS_WEB_STREAM_MAX_CLIENTS:-2}

      # Browser commands travel over control; Chrome uses its dedicated egress network.
      SELENIUM_REMOTE_URL: http://chrome:4444/wd/hub
      NO_PROXY: ollama,chrome,localhost,127.0.0.1
      no_proxy: ollama,chrome,localhost,127.0.0.1
    volumes:
      - agent-logs:/app/logs
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    depends_on:
      ollama:
        condition: service_healthy
      chrome:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - djenis-control

  # The only host-facing service. The agent remains isolated on djenis-control;
  # this unprivileged reverse proxy bridges loopback ingress into that network.
  gateway:
    image: nginxinc/nginx-unprivileged:1.30.0-alpine@sha256:808f7846d21a9c94cf53833e8807a00a33fd0b65cc47fb05b79efe366c2d201f
    container_name: djenis-gateway
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    stop_grace_period: 10s
    ports:
      - "127.0.0.1:8008:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    depends_on:
      djenis-agent:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - djenis-control
      - console-ingress

  # Runtime model server. It has no published port and no internet-facing network.
  # The model volume must be populated explicitly with the provisioning profile.
  ollama:
    image: ollama/ollama:0.32.4@sha256:10c13eb515db310990527d36ca14a136da4bcc0fbf2bf3b15e9c1f111e9d3cd4
    container_name: djenis-ollama
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    stop_grace_period: 30s
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NOHISTORY: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
    tmpfs:
      - /tmp:size=256m,nosuid,nodev
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - djenis-control

  # Opt-in downloader. It never starts during a normal `docker compose up`.
  # Run: docker compose --profile provision run --rm ollama-provision
  ollama-provision:
    profiles:
      - provision
    image: ollama/ollama:0.32.4@sha256:10c13eb515db310990527d36ca14a136da4bcc0fbf2bf3b15e9c1f111e9d3cd4
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        /bin/ollama serve &
        server_pid=$$!
        trap 'kill "$$server_pid"' EXIT
        until /bin/ollama list >/dev/null 2>&1; do sleep 1; done
        /bin/ollama pull "$$DJENIS_LOCAL_LLM_MODEL"
    environment:
      DJENIS_LOCAL_LLM_MODEL: ${DJENIS_LOCAL_LLM_MODEL:-qwen3-vl:8b}
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NOHISTORY: "1"
    volumes:
      - ollama-models:/root/.ollama
    tmpfs:
      - /tmp:size=256m,nosuid,nodev
    networks:
      - model-provisioning

  # Chrome is the only service intended to navigate operator-controlled destinations.
  chrome:
    image: selenium/standalone-chromium:4.46.0-20260707@sha256:3400b92f1cddb2dfaaf358654e8f7d83d7be45192fb73c5f28c25faa28d36504
    container_name: djenis-chrome
    restart: unless-stopped
    shm_size: 2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SE_NODE_MAX_SESSIONS: 1
      SE_NODE_OVERRIDE_MAX_SESSIONS: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - djenis-control
      - browser-egress

volumes:
  agent-logs:
    driver: local
  ollama-models:
    driver: local

networks:
  # Agent/model/control traffic cannot reach the internet through this network.
  djenis-control:
    driver: bridge
    internal: true
  # Only the hardened gateway joins this host-reachable ingress network.
  console-ingress:
    driver: bridge
  # Chrome requires egress to visit operator-requested public pages.
  browser-egress:
    driver: bridge
  # Present only for the explicit model-download profile.
  model-provisioning:
    driver: bridge
