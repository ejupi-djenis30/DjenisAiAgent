worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format gateway
        '$remote_addr - $remote_user [$time_local] '
        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
        'request_time=$request_time upstream_time=$upstream_response_time';
    access_log /dev/stdout gateway;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    # The unprivileged image and read-only root filesystem require writable
    # request/proxy scratch space under the mounted /tmp tmpfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Docker's embedded DNS lets the gateway survive an agent-container recreate.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream djenis_agent {
        zone djenis_agent 64k;
        server djenis-agent:8000 resolve;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        # The application applies its exact configured upload bound. This outer
        # ceiling prevents an accidental unbounded proxy spool.
        client_max_body_size 6m;
        client_body_timeout 30s;
        send_timeout 75s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location / {
            proxy_pass http://djenis_agent;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Upgrade "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 75s;
            proxy_read_timeout 130s;
        }

        location = /ws {
            proxy_pass http://djenis_agent;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        location = /stream {
            proxy_pass http://djenis_agent;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 75s;
            proxy_read_timeout 3600s;
        }

        location = /api/transcribe {
            proxy_pass http://djenis_agent;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
